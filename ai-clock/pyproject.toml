[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clockai"
version = "0.1.0"
description = "AI scheduled task manager - send prompts to aim on a schedule"
requires-python = ">=3.10"

[project.scripts]
clockai = "clockai.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["**/__pycache__"]

[tool.ruff.lint]
select = ["E9", "F"]
