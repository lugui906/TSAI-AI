# TSAI-OS 隔空手势系统全局配置
# 支持热重载：修改本文件无需重启服务，保存后自动生效。

[general]
enable = true
# 唤醒态无动作多少秒后回落休眠态
sleep_timeout_sec = 3

[gestures]
# 前推暂停 + 上下滑动滚动
gesture_scroll_up = true
gesture_scroll_down = true
gesture_playpause = true

[camera]
# 摄像头设备：/dev/videoN 或整数索引；demo 代表测试源（无硬件）
device = /dev/video0
sleep_fps = 5
# 唤醒态帧率：越高跟踪越稳、方向越准（受 CPU/模型推理速度限制，实际约 ~9fps）
wake_fps = 10

[inference]
# 推理线程数（自动适配 CPU 核心数，最大 4）
num_thread = 2
# 最小检测置信度（低于则丢弃帧）
min_detect_conf = 0.5
# 最小跟踪置信度
min_track_conf = 0.6
# 手势触发冷却时间（毫秒，防连击）
cool_down_ms = 2000
# 手势结束后强制暂停识别多少秒（防收手回撤/连击误触发）
rearm_sec = 2.0
# 前推判定：手掌尺寸增长率需超过该值（0.01 = 增长 1% 即触发），
# 已调至最低灵敏度：轻轻前推一下即暂停/播放
push_threshold = 0.1
# 上下滑动专属位移阈值（中心 Y 位移 / 手宽，越小越好触发）
vertical_frac = 0.08
