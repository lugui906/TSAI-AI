<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChinAI3</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header id="topbar">
        <button class="chip" id="sidebarToggle" title="收起/展开侧栏">☰</button>
        <span class="brand">Chin<em>AI3</em></span>
        <span class="brand-sub">AI 中枢 · 多引擎</span>
        <div class="spacer"></div>
        <button class="chip" id="modelChip" title="当前模型 · 点击在设置中切换"></button>
        <button class="chip" id="ctxBtn" title="发送时自动附加活动上下文（帮助 AI 分析）">📡</button>
        <button class="chip" id="shotBtn" title="截图并 OCR（作为附件随消息发送）">📷</button>
        <button class="chip" id="ctxTineBtn" title="读取界面上下文（tine tree，随下条消息前置给 AI）">🌐</button>
        <button class="chip" id="actPanelBtn" title="AI 活动记录控制面板">🗂️</button>
        <button class="chip" id="memBtn" title="AI 记忆 · 习惯/职业/常用软件">🧠</button>
        <button class="chip" id="schedBtn" title="AI 日程 · 当天任务安排">🗓️</button>
        <button class="chip" id="multiBtn" title="多选消息">☑ 多选</button>
    </header>

    <div id="layout">
        <aside id="sidebar">
            <button class="chip primary side-new" id="newChatBtn">＋ 新对话</button>

            <div class="side-sec" id="appSec">
                <button class="side-title side-collapse" id="appSecToggle" title="折叠/展开">
                    <span class="chev">▾</span><span>AI 应用</span>
                </button>
                <div id="appList"></div>
            </div>

            <div class="side-sec grow">
                <div class="side-title">
                    <span>历史记录</span>
                    <span class="side-title-actions">
                        <button class="chip small hidden" id="hDelBtn">删除选中</button>
                        <button class="chip small" id="convBtn" title="切换 aim 会话">⇄ 会话</button>
                        <button class="chip small" id="hMultiBtn">☑ 多选</button>
                        <button class="chip small" id="hClearBtn">清空</button>
                    </span>
                </div>
                <div id="historyList"><div class="empty">暂无记录</div></div>
            </div>

            <div class="side-foot">
                <button class="chip side-settings" id="settingsBtn">⚙ 设置</button>
            </div>
        </aside>

        <main id="chatArea">
            <div id="welcome">
                <div class="welcome-title">您好，我是 Chin<span>AI3</span></div>
                <div class="welcome-sub">可以帮你搜索、答疑、写作、分析文档，把你的任务交给我吧～</div>
                <div class="sugg">
                    <button class="chip sugg-chip" data-q="帮我写一份本周工作周报">📝 写份周报</button>
                    <button class="chip sugg-chip" data-q="把这段文字翻译成英文">🌐 翻译</button>
                    <button class="chip sugg-chip" data-q="解释一下什么是大语言模型">💡 答疑</button>
                    <button class="chip sugg-chip" data-q="帮我列出学习 Python 的计划">📚 学习计划</button>
                </div>
            </div>
            <div id="msgList" class="hidden"></div>
        </main>
    </div>

    <footer id="inputBar">
        <div id="batchBar" class="hidden">
            <span>已选 <b id="selCount">0</b> 条</span>
            <button class="chip small" id="batchCopy">复制</button>
            <button class="chip small" id="batchDel">删除</button>
            <button class="chip small" id="batchCancel">取消</button>
        </div>
        <div id="fileBar" class="hidden">
            <div id="fileChips"></div>
        </div>
        <div class="input-card">
            <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Ctrl+Enter 换行）"></textarea>
            <button class="icon-btn tool" id="attachBtn" title="上传任意类型文件（AI 将获得文件路径）">📎</button>
            <button class="icon-btn primary" id="sendBtn" title="发送">↑</button>
            <button class="icon-btn warn hidden" id="stopBtn" title="停止">■</button>
        </div>
    </footer>

    <div id="settingsModal" class="modal-mask hidden">
        <div class="modal">
            <div class="modal-head">
                <span class="modal-title">⚙ 设置</span>
                <button class="modal-close" id="settingsClose">×</button>
            </div>
            <div class="modal-body">
                <label class="lbl">模型后端</label>
                <div id="backendSeg" class="seg">
                    <button class="chip seg-item" data-backend="aim">aim（云端）</button>
                    <button class="chip seg-item" data-backend="ollama">Ollama（本地）</button>
                </div>

                <label class="lbl">AIM 引擎（aim oc）</label>
                <div class="seg" id="engineSeg">
                    <button class="chip seg-item" data-engine="opencode">opencode</button>
                    <button class="chip seg-item" data-engine="openclaw">openclaw</button>
                </div>

                <label class="lbl">模型（自动检测 · 记住上次选择）</label>
                <div class="model-row">
                    <select id="modelSelect" title="模型"></select>
                    <button class="chip" id="detectBtn">⟳ 检测</button>
                    <span id="modelStatus" class="muted">检测中…</span>
                </div>

                <label class="lbl">系统 AI 应用（应用菜单 · 直接打开）</label>
                <div id="sysAppList" class="sysapp-list"></div>
            </div>
            <div class="modal-foot">
                <span id="saveMsg" class="muted"></span>
                <button class="chip primary" id="settingsSave">保存</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <div class="modal-back hidden" id="convModal">
  <div class="modal">
    <div class="modal-head">⇄ 切换 aim 会话<span class="spacer"></span><button class="chip" id="convClose">✕</button></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-2);margin-bottom:8px;">选中后，后续发送将 <b>继续该会话</b>（aim change）。</div>
      <div id="convList" style="display:flex;flex-direction:column;gap:4px;max-height:320px;overflow-y:auto;"></div>
    </div>
    <div class="modal-foot"><button class="btn" id="convCancel">取消</button></div>
  </div>
</div>


<!-- AI 活动记录控制面板 -->
<div class="modal-back hidden" id="actModal">
  <div class="modal">
    <div class="modal-head">
      🗂️ AI 活动记录
      <span class="spacer"></span>
      <span id="actStatusDot" style="font-size:12px;color:var(--text-2)">—</span>
      <button class="chip" id="actRefresh" title="刷新">⟳</button>
      <button class="chip" id="actClose">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;">
        <label class="lbl" style="margin:0;flex:0 auto;">📡 发送时附加活动上下文</label>
        <button class="chip" id="ctxShareToggle" style="flex:0 auto;">关</button>
        <span class="muted" id="actHint" style="flex:1;font-size:11px;"></span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:6px;">
        <button class="chip small seg-item" id="actTabWin" data-tab="win">窗口日志</button>
        <button class="chip small seg-item" id="actTabFile" data-tab="file">最近文件</button>
      </div>
      <div id="actPanelList" style="display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto;font-size:12px;"></div>
    </div>
  </div>
</div>


<!-- AI 记忆 modal -->
<div class="modal-back hidden" id="memModal">
  <div class="modal">
    <div class="modal-head">
      🧠 AI 记忆
      <span class="spacer"></span>
      <button class="chip" id="memRefresh">⟳</button>
      <button class="chip" id="memClose">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-2);margin-bottom:8px;">
        AI 会根据你的活动日志（窗口/文件操作）持续了解你，自动维护记忆：
        <b>用户习惯 · 职业 · 常用软件</b>。
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;">
        <span style="color:var(--text-2);flex:0 0 auto;">自动循环更新</span>
        <div class="seg" id="memIntervalSeg" style="flex:1;">
          <button class="chip small seg-item" data-iv="off">关</button>
          <button class="chip small seg-item" data-iv="daily">每天</button>
          <button class="chip small seg-item" data-iv="weekly">每周</button>
          <button class="chip small seg-item" data-iv="monthly">每月</button>
          <button class="chip small seg-item" data-iv="quarterly">每季</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;">
        <span style="color:var(--text-2);flex:0 0 auto;">📡 附加上下文时长</span>
        <div class="seg" id="ctxMinSeg" style="flex:1;">
          <button class="chip small seg-item" data-min="5">5分钟</button>
          <button class="chip small seg-item" data-min="10">10分钟</button>
          <button class="chip small seg-item" data-min="30">30分钟</button>
          <button class="chip small seg-item" data-min="60">1小时</button>
          <button class="chip small seg-item" data-min="1440">当天</button>
        </div>
      </div>
      <div style="margin-bottom:8px;">
        <button class="chip primary" id="memUpdateBtn">🔄 立即更新记忆</button>
        <span class="muted" id="memUpdateState" style="font-size:11px;margin-left:6px;"></span>
      </div>
      <div id="memBody" style="display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;font-size:13px;"></div>
    </div>
  </div>
</div>


<!-- AI 日程 modal -->
<div class="modal-back hidden" id="schedModal">
  <div class="modal">
    <div class="modal-head">
      🗓️ AI 日程
      <span class="spacer"></span>
      <button class="chip" id="schedRefresh">⟳</button>
      <button class="chip" id="schedClose">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <button class="chip primary" id="schedAddBtn">＋ 新增日程</button>
        <span class="muted" id="schedHint">在「日程」对话里让 AI 安排当天任务，或在此手动添加。触发后 AI 自动执行。</span>
      </div>
      <div id="schedForm" class="hidden" style="border:1px solid rgba(128,128,128,.2);padding:8px;margin-bottom:8px;border-radius:6px;">
        <input id="schedTitle" placeholder="任务名" style="width:100%;margin-bottom:4px;padding:4px;box-sizing:border-box;">
        <textarea id="schedTask" placeholder="给AI执行的任务描述…" rows="2" style="width:100%;margin-bottom:4px;padding:4px;box-sizing:border-box;"></textarea>
        <select id="schedType" style="width:100%;margin-bottom:4px;padding:4px;">
          <option value="time">时间触发 (每天 HH:MM)</option>
          <option value="cron">Cron 表达式</option>
          <option value="event">事件触发 (打开应用)</option>
        </select>
        <input id="schedWhen" placeholder="如 14:00 / 0 14 * * * / open_app:papers" style="width:100%;margin-bottom:6px;padding:4px;box-sizing:border-box;">
        <div style="display:flex;gap:6px;justify-content:flex-end;">
          <button class="chip" id="schedCancel">取消</button>
          <button class="chip primary" id="schedSave">保存</button>
        </div>
      </div>
      <div id="schedList" style="display:flex;flex-direction:column;gap:4px;max-height:320px;overflow-y:auto;font-size:12px;"></div>
    </div>
  </div>
</div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
