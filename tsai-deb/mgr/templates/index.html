<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 电脑管家</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      body { display:flex; flex-direction:column; height:100vh; margin:0; overflow:hidden;
             background:transparent; color:var(--text); font-family:var(--font); }
      #topbar { display:flex; align-items:center; gap:10px; padding:10px 18px;
                background:var(--panel); border-bottom:1px solid var(--panel-border);
                -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
                border-radius:12px 12px 0 0; z-index:20; }
      #layout { flex:1; display:flex; min-height:0; gap:12px; padding:12px; }
      #sidebar { width:178px; flex-shrink:0; display:flex; flex-direction:column; gap:4px;
                 background:var(--panel); border:1px solid var(--panel-border);
                 border-radius:12px; padding:8px;
                 -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
                 box-shadow:var(--shadow); overflow-y:auto; }
      #sidebar .menu-btn { border:none; background:transparent; color:var(--text);
                 text-align:left; padding:10px 12px; border-radius:8px; font-size:13px;
                 font-family:var(--font); cursor:pointer; }
      #sidebar .menu-btn:hover { background:rgba(30,136,229,.10); color:var(--blue-dark); }
      #sidebar .menu-btn.active { background:var(--blue); color:#fff; font-weight:600; }
      #panelArea { flex:1; min-width:0; display:flex; flex-direction:column;
                 background:var(--panel); border:1px solid var(--panel-border);
                 border-radius:12px; box-shadow:var(--shadow);
                 -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
                 overflow:hidden; }
      #statusbar { display:flex; align-items:center; gap:8px; padding:6px 14px;
                 border-bottom:1px solid var(--panel-border); font-size:12px; color:var(--text-2); }
      #statusbar .dot { width:8px; height:8px; border-radius:50%; background:#9ca3af; }
      #statusbar .dot.run { background:#22c55e; }
      #statusbar .dot.err { background:#ef4444; }
      #panelBody { flex:1; overflow-y:auto; padding:18px 20px; }

      .ask-mask { position:fixed; inset:0; background:rgba(20,26,38,.45); display:flex; align-items:center;
        justify-content:center; z-index:99; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
      .ask-card { width:420px; max-width:90vw; background:var(--panel-solid,#fff); border:1px solid var(--panel-border);
        border-radius:16px; padding:22px 24px; box-shadow:0 18px 50px rgba(0,0,0,.25); }
      .ask-icon { font-size:26px; }
      .ask-title { font-size:16px; font-weight:800; margin:6px 0 10px; color:var(--text); }
      .ask-desc { font-size:14px; color:var(--text); margin-bottom:8px; line-height:1.6; }
      .ask-cmd { font-family:var(--mono); font-size:12px; background:rgba(0,0,0,.05); border-radius:8px;
        padding:8px 10px; word-break:break-all; color:var(--text-2); }
      .ask-btns { display:flex; gap:8px; margin-top:14px; align-items:center; }

      .ptitle { font-size:18px; font-weight:700; margin:0 0 14px; color:var(--text); }
      .grid { display:grid; gap:12px; }
      .g2 { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
      .cell { background:var(--panel-solid); border:1px solid var(--panel-border);
              border-radius:10px; padding:12px 14px; }
      .cell .k { color:var(--text-2); font-size:12px; }
      .cell .v { font-size:20px; font-weight:800; margin-top:2px; }
      .bar { height:6px; border-radius:3px; background:rgba(0,0,0,.06); overflow:hidden; margin-top:8px; }
      .bar>i { display:block; height:100%; background:var(--blue); border-radius:3px; }
      .kv-table { width:100%; border-collapse:collapse; font-size:13px; }
      .kv-table td { padding:5px 8px; border-bottom:1px solid var(--panel-border); }
      .kv-table td.k { color:var(--text-2); width:150px; }
      .kv-table td.mono { font-family:var(--mono); }
      .act-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
      .act-grid .chip { padding:12px; font-size:14px; text-align:center; }
      .data-table { width:100%; border-collapse:collapse; font-size:12.5px; }
      .data-table th { text-align:left; color:var(--text-2); font-weight:600; padding:6px 8px;
                       border-bottom:1px solid var(--border,#e5e7eb); position:sticky; top:0;
                       background:var(--panel-solid); }
      .data-table td { padding:5px 8px; border-bottom:1px solid var(--panel-border); font-family:var(--mono); }
      .data-table tr:hover { background:rgba(30,136,229,.06); }
      .logbox { background:#0f1115; color:#d7d9de; font-family:var(--mono); font-size:12px;
                border-radius:10px; padding:12px; height:200px; overflow:auto; white-space:pre-wrap; }
      .logbox.big { height:300px; }
      .tool-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:520px; }
      .tool-grid .chip { padding:14px; }
      .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
      .hint { color:var(--text-2); font-size:12px; margin:4px 0 10px; }
      select,input[type=text] { padding:7px 10px; border:1px solid var(--border,#d1d5db);
                border-radius:8px; background:var(--panel-solid); color:var(--text); font-size:13px; }
      .btn-row { display:flex; gap:8px; margin-top:10px; }
      .pane-card { background:var(--panel-solid); border:1px solid var(--panel-border);
                border-radius:10px; padding:12px; margin-bottom:12px; }
      .pane-card .pc-title { font-size:13px; font-weight:600; margin-bottom:8px; }
      @media(max-width:820px){ #sidebar{ width:52px; } #sidebar .menu-btn span{ display:none; } }
    </style>
</head>
<body>
    <header id="topbar">
        <span class="brand">AI <em>电脑管家</em></span>
        <span class="brand-sub">系统监控 · AI 智能优化 · 进程/磁盘/网络管理</span>
        <div class="spacer"></div>
        <button class="chip" id="refreshBtn" title="刷新当前面板">⟳ 刷新</button>
    </header>

    <div id="layout">
        <aside id="sidebar"></aside>
        <main id="panelArea">
            <div id="statusbar">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">就绪</span>
                <div class="spacer"></div>
                <button class="chip small danger hidden" id="stopOpBtn">■ 停止</button>
            </div>
            <div id="panelBody"></div>
        </main>
    </div>

    <div id="askModal" class="ask-mask hidden">
      <div class="ask-card">
        <div class="ask-icon">🔒</div>
        <div class="ask-title">需要你确认</div>
        <div class="ask-desc" id="askDesc"></div>
        <div class="ask-cmd" id="askCmd"></div>
        <div class="ask-btns">
          <button class="chip primary" id="askAllow">✓ 执行</button>
          <button class="chip" id="askSkip">跳过</button>
          <button class="chip small" id="askAll" title="此动作后续需要确认的命令全部自动执行">全部执行</button>
        </div>
        <div class="hint" id="askHint" style="color:var(--text-2);font-size:11px;margin-top:6px;">只执行低风险操作，涉及 sudo / 删除 / 安装 等操作会先询问</div>
      </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
