<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 模型管理器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      body { display:flex; flex-direction:column; height:100vh; margin:0; overflow:hidden;
             background:transparent; color:var(--text); font-family:var(--font); }
      #topbar { display:flex; align-items:center; gap:10px; padding:10px 16px;
             background:var(--panel); border-bottom:1px solid var(--panel-border);
             -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
             border-radius:12px 12px 0 0; z-index:20; }
      #layout { flex:1; display:flex; flex-direction:column; min-height:0; gap:10px; padding:10px 12px; }
      #tabs { display:flex; gap:6px; flex-wrap:wrap; }
      #tabs .tab-btn { border:none; background:rgba(255,255,255,.6); color:var(--text); padding:8px 14px;
             border-radius:9px; font-size:13px; font-family:var(--font); cursor:pointer;
             border:1px solid var(--panel-border); -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); }
      #tabs .tab-btn:hover { background:rgba(30,136,229,.10); }
      #tabs .tab-btn.active { background:var(--blue); color:#fff; font-weight:600; }
      #tabBody { flex:1; overflow-y:auto; background:var(--panel); border:1px solid var(--panel-border);
             border-radius:12px; box-shadow:var(--shadow);
             -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); padding:16px 18px; }
      .sec-note { color:var(--text-2); font-size:12px; margin:2px 0 10px; }
      .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
      .lbl { width:110px; color:var(--text-2); font-size:13px; flex-shrink:0; }
      input[type=text], textarea, select { padding:7px 10px; border:1px solid var(--border,#d1d5db);
             border-radius:8px; background:var(--panel-solid); color:var(--text); font-size:13px; }
      input[type=text] { min-width:200px; flex:1; }
      textarea { font-family:var(--mono); width:100%; }
      .card { border:1px solid var(--panel-border); border-radius:10px; padding:12px 14px;
             margin-bottom:12px; background:var(--panel-solid); }
      .card .ct { font-weight:600; font-size:13px; margin-bottom:8px; }
      .data-table { width:100%; border-collapse:collapse; font-size:12.5px; }
      .data-table th { text-align:left; color:var(--text-2); font-weight:600; padding:6px 8px;
             border-bottom:1px solid var(--border,#e5e7eb); background:var(--panel-solid); }
      .data-table td { padding:5px 8px; border-bottom:1px solid var(--panel-border); font-family:var(--mono);
             vertical-align:top; }
      .data-table tr:hover { background:rgba(30,136,229,.06); }
      .model-list { max-height:180px; overflow:auto; border:1px solid var(--panel-border); border-radius:8px;
             padding:6px; margin-top:6px; font-family:var(--mono); font-size:12px; background:var(--panel-solid); }
      .model-list .mi { padding:4px 8px; border-radius:6px; cursor:pointer; }
      .model-list .mi:hover { background:rgba(30,136,229,.10); }
      .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; }
      .badge.on { background:rgba(34,197,94,.15); color:#16a34a; }
      .badge.off { background:rgba(107,114,128,.15); color:var(--text-2); }
      #statusbar { display:flex; align-items:center; gap:8px; padding:4px 14px; font-size:12px;
             color:var(--text-2); border-top:1px solid var(--panel-border); }
    </style>
</head>
<body>
    <header id="topbar">
        <span class="brand">AI <em>模型管理器</em></span>
        <span class="brand-sub">模型 · Provider · AIM 引擎</span>
        <div class="spacer"></div>
        <button class="chip" id="reloadBtn" title="刷新全部">⟳ 刷新</button>
    </header>

    <div id="layout">
        <div id="tabs">
            <button class="tab-btn active" data-tab="default">🎯 默认模型</button>
            <button class="tab-btn" data-tab="engine">⚙ AIM 引擎</button>
            <button class="tab-btn" data-tab="provider">🏷 自定义 Provider</button>

        </div>
        <div id="tabBody"></div>
    </div>

    <div id="statusbar"><span id="statusText">就绪</span></div>

    <div id="toast" class="toast hidden"></div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
